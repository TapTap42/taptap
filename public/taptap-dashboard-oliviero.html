<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapTap — Dashboard Carrozzeria Oliviero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --petrol-deep: #0c3335;
    --petrol: #124548;
    --petrol-light: #1b5b5e;
    --yellow: #f5c518;
    --yellow-dim: #f5c51833;
    --cream: #f6f4ee;
    --cream-dim: #f6f4ee99;
    --red: #e0654f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at 50% -10%, var(--petrol) 0%, var(--petrol-deep) 60%);
    color: var(--cream);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding: 28px 16px 60px;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  .mark { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; opacity: 0.85; }
  .mark svg { width: 20px; height: 20px; }
  .mark span { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.02em; color: var(--yellow); }

  h1 { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 26px; margin-bottom: 2px; }
  .sub { color: var(--cream-dim); font-size: 13px; margin-bottom: 26px; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
  .card {
    background: var(--petrol);
    border: 1px solid var(--petrol-light);
    border-radius: 8px;
    padding: 16px 10px;
    text-align: center;
  }
  .card .num { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 26px; color: var(--yellow); }
  .card .label { font-size: 11px; color: var(--cream-dim); margin-top: 4px; line-height: 1.3; }

  @media (max-width: 420px) {
    .cards { grid-template-columns: 1fr 1fr; }
    .card:last-child { grid-column: span 2; }
  }

  section { margin-bottom: 28px; }
  h2 { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px; margin-bottom: 12px; color: var(--cream); text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.85; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .bar-row .stars-lbl { width: 46px; flex-shrink: 0; color: var(--cream-dim); }
  .bar-track { flex: 1; height: 10px; background: var(--petrol); border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--yellow); border-radius: 5px; transition: width 0.4s ease; }
  .bar-count { width: 26px; text-align: right; flex-shrink: 0; color: var(--cream-dim); }

  .activity-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--petrol-light);
    font-size: 13px;
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-date { color: var(--cream-dim); }
  .activity-stars { color: var(--yellow); letter-spacing: 1px; }

  .empty {
    text-align: center;
    padding: 30px 14px;
    color: var(--cream-dim);
    font-size: 14px;
    background: var(--petrol);
    border-radius: 8px;
    border: 1px dashed var(--petrol-light);
  }

  .refresh-btn {
    display: block;
    width: 100%;
    background: var(--yellow);
    color: var(--petrol-deep);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 13px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 6px;
  }
  .refresh-btn:active { transform: scale(0.98); }
  .updated { text-align: center; font-size: 11px; color: var(--cream-dim); margin-top: 10px; }

  .error { color: var(--red); font-size: 13px; text-align: center; padding: 16px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 12a8 8 0 0 1 16 0" stroke="#f5c518" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 12a5 5 0 0 1 10 0" stroke="#f5c518" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <circle cx="12" cy="12" r="2" fill="#f5c518"/>
    </svg>
    <span>TAPTAP — DASHBOARD INTERNA</span>
  </div>
  <h1>Carrozzeria Oliviero</h1>
  <div class="sub">Dati grezzi dal foglio collegato alla card NFC — solo per te.</div>

  <div id="content">
    <div class="empty">Caricamento dati…</div>
  </div>

  <button class="refresh-btn" id="refresh-btn">Aggiorna dati</button>
  <div class="updated" id="updated-lbl"></div>
</div>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQg48CXxi2RmDWiLmtg2mckFACajc9ay_q6A9Y1hGeIOpMRWO_Tr-B2nrwXEvYR2uj3EmnhGb0TbLYC/pub?gid=1431173735&single=true&output=csv';

  const content = document.getElementById('content');
  const updatedLbl = document.getElementById('updated-lbl');

  function starGlyphs(n) {
    return '★★★★★☆☆☆☆☆'.slice(5 - n, 10 - n);
  }

  function render(rows) {
    // rows: array di {timestamp, rating}
    const total = rows.length;

    if (total === 0) {
      content.innerHTML = '<div class="empty">Ancora nessun tap registrato.<br>Appena qualcuno usa la card, i dati compaiono qui.</div>';
      return;
    }

    const sum = rows.reduce((a, r) => a + r.rating, 0);
    const avg = (sum / total).toFixed(1);
    const positivi = rows.filter(r => r.rating >= 4).length;
    const pctPositivi = Math.round((positivi / total) * 100);

    const dist = [1, 2, 3, 4, 5].map(v => rows.filter(r => r.rating === v).length);
    const maxDist = Math.max(...dist, 1);

    const recent = rows.slice().reverse().slice(0, 15);

    content.innerHTML = `
      <div class="cards">
        <div class="card"><div class="num">${total}</div><div class="label">Tap totali</div></div>
        <div class="card"><div class="num">${avg}</div><div class="label">Media voti</div></div>
        <div class="card"><div class="num">${pctPositivi}%</div><div class="label">Andati su Google</div></div>
      </div>

      <section>
        <h2>Distribuzione voti</h2>
        ${[5,4,3,2,1].map(v => {
          const count = dist[v-1];
          const pct = Math.round((count / maxDist) * 100);
          return `<div class="bar-row">
            <div class="stars-lbl">${v} ★</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="bar-count">${count}</div>
          </div>`;
        }).join('')}
      </section>

      <section>
        <h2>Ultimi tap</h2>
        ${recent.map(r => `
          <div class="activity-item">
            <span class="activity-date">${r.timestamp}</span>
            <span class="activity-stars">${starGlyphs(r.rating)}</span>
          </div>
        `).join('')}
      </section>
    `;
  }

  function loadData() {
    content.innerHTML = '<div class="empty">Caricamento dati…</div>';
    fetch(CSV_URL, { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('network');
        return res.text();
      })
      .then(csvText => {
        const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
        const rows = parsed.data
          .map(r => ({
            timestamp: r['Informazioni cronologiche'] || '',
            rating: parseInt(r['Valutazione'], 10)
          }))
          .filter(r => !isNaN(r.rating));
        render(rows);
        updatedLbl.textContent = 'Aggiornato alle ' + new Date().toLocaleTimeString('it-IT');
      })
      .catch(() => {
        content.innerHTML = '<div class="error">Non riesco a leggere il foglio. Controlla la connessione e riprova con "Aggiorna dati".</div>';
      });
  }

  document.getElementById('refresh-btn').addEventListener('click', loadData);
  loadData();
</script>

</body>
</html>
